name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        # Pinned to v5.2.2 via SHA for supply-chain stability
        uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          # Set to match your local version for lockfile parity
          version: "0.10.0"

      - name: Set up Python
        # uv uses your pyproject.toml to decide the exact patch version
        run: uv python install 3.12

      - name: Run Pre-commit
        # This ensures all hooks (Black, Mypy) run in the uv-managed environment
        run: uv run pre-commit run --all-files
