name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Super fast subsequent runs
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12 # Matches your new syntax needs

      - name: Run Pre-commit
        # This runs everything (Black, Mypy, etc.) exactly like your local machine
        run: uv run pre-commit run --all-files
