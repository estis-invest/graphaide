name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches your dev environment

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy pandas pandas-stubs

      - name: Run Black
        run: black --check .

      - name: Run Mypy
        run: mypy . --ignore-missing-imports
